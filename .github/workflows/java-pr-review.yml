name: Java PR Review

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        type: string
        default: "21"
      gradle_version:
        required: false
        type: string
        default: "8.10"
      gradle_task_build:
        required: false
        type: string
        default: "build"
      gradle_task_test:
        required: false
        type: string
        default: "test"
      service_name:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Build project
        run: gradle ${{ inputs.gradle_task_build }}

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Run tests
        run: gradle ${{ inputs.gradle_task_test }}
