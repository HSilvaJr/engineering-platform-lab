name: Java PR Review

on:
  workflow_call:
    inputs:
      java_version:
        required: false
        type: string
        default: "21"
      gradle_version:
        required: false
        type: string
        default: "8.10"
      gradle_task_build:
        required: false
        type: string
        default: "build"
      gradle_task_test:
        required: false
        type: string
        default: "test"
      service_name:
        required: true
        type: string
    secrets:
      ANTHROPIC_API_KEY:
        required: true

permissions:
  contents: read
  pull-requests: write

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Build project
        run: gradle ${{ inputs.gradle_task_build }}

  unit-tests:
    name: unit-tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java_version }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ inputs.gradle_version }}

      - name: Run tests
        run: gradle ${{ inputs.gradle_task_test }}

  ai-review:
    name: ai-review
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Checkout engineering platform
        uses: actions/checkout@v4
        with:
          repository: HSilvaJr/engineering-platform-lab
          path: platform

      - name: Get PR diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > pr.diff

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install anthropic

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REVIEW_POLICY_PATH: platform/policies/java-review-policy.md
          SERVICE_NAME: ${{ inputs.service_name }}
        run: |
          python platform/scripts/ai_review.py

